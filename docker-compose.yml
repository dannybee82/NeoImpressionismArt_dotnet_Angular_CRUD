services:
  angular_app:
    build:
      dockerfile: Dockerfile
      context: ./frontend
    container_name: angular_app
    restart: unless-stopped
    networks:
      - angular-dotnet-sql
    ports:
      - "80:80"
    depends_on:
      - dotnet_api

  dotnet_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dotnet_api
    restart: unless-stopped
    networks:
      - angular-dotnet-sql
    environment:
      ASPNETCORE_ENVIRONMENT: LocalDocker
      ASPNETCORE_URLS: http://*:5001
      ConnectionStrings__DefaultConnection: Host=postgresql_database;Port=5432;Database=NeoImpressionismArt;Username=postgres;Password=TestDocker2026
    ports:
      - "5001:5001"
    depends_on:
      dotnet_migrations:
        condition: service_completed_successfully

  dotnet_migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile.migrations
    container_name: dotnet_migrations
    networks:
      - angular-dotnet-sql
    environment:
      ASPNETCORE_ENVIRONMENT: LocalDocker
      ConnectionStrings__DefaultConnection: >-  
        Host=postgresql_database;Port=5432;Database=NeoImpressionismArt;  
        Username=postgres;Password=TestDocker2026
    depends_on:
      postgresql_database:
        condition: service_healthy
    restart: "no"

  postgresql_database:
    image: postgres:17
    container_name: postgresql_database
    restart: unless-stopped
    networks:
      - angular-dotnet-sql
    environment:
      POSTGRES_DB: neoimpressionismart
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: TestDocker2026
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neoimpressionismart"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  angular-dotnet-sql:
    driver: bridge

volumes:
  postgresql_data: